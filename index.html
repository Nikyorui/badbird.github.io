<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
    }

    #poopGif {
      width: 98vmin;
      height: 98vmin;
      object-fit: contain;
      cursor: pointer;
      transition: transform 1s ease;
    }

    #poopGif.started {
      transform: scale(1.4);
      pointer-events: none;
    }
  </style>
</head>

<body>

  <img
    id="poopGif"
    src="poop.GIF"
    alt="Poop"
  >

  <audio
    id="music"
    src="mus.mp3"
    loop
    playsinline>
  </audio>

  <script>
    const music = document.getElementById("music");
    const gif = document.getElementById("poopGif");

    gif.addEventListener("click", async () => {

      try {
        // Максимальная громкость HTML-аудио
        music.volume = 1.0;

        await music.play();

        gif.classList.add("started");

        if ("vibrate" in navigator) {
          navigator.vibrate([
            200,
            100,
            200,
            100,
            500
          ]);
        }

      } catch (error) {
        console.error("Не удалось запустить музыку:", error);
      }

    });
  </script>

</body>
</html>
