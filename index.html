<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poop</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      background: black;
      font-family: Arial, sans-serif;
    }

    #poopButton {
      width: 98vmin;
      height: 98vmin;

      border: none;
      border-radius: 50%;

      background: red;
      color: white;

      font-size: 18vmin;
      font-weight: bold;

      cursor: pointer;

      transition: transform 1s ease;
    }

    #poopButton.started {
      transform: scale(1.4);
      pointer-events: none;
    }
  </style>
</head>

<body>

  <button id="poopButton">Poop</button>

  <audio
    id="music"
    src="mus.mp3"
    autoplay
    loop
    playsinline>
  </audio>

  <script>
    const music = document.getElementById("music");
    const button = document.getElementById("poopButton");

    // Пытаемся включить музыку сразу после открытия сайта
    window.addEventListener("load", async () => {
      try {
        await music.play();

        button.classList.add("started");

        // Вибрация, если браузер разрешает её без взаимодействия
        if ("vibrate" in navigator) {
          navigator.vibrate([
            200,
            100,
            200,
            100,
            500
          ]);
        }

      } catch (error) {
        console.log("Автозапуск заблокирован браузером:", error);
      }
    });

    // Запасной вариант: если браузер заблокировал autoplay,
    // первое касание запустит музыку
    document.addEventListener("click", async () => {
      try {
        await music.play();

        button.classList.add("started");

        if ("vibrate" in navigator) {
          navigator.vibrate([
            200,
            100,
            200,
            100,
            500
          ]);
        }
      } catch (error) {
        console.log(error);
      }
    }, { once: true });
  </script>

</body>
</html>
